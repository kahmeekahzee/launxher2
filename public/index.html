<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <!-- Where the Worker lives. Leave empty if the Worker is routed at /api/* on this same domain. -->
  <meta name="api-base" content="https://causeway-watch-api.9nhi5b.workers.dev">
  <title>JamOrNot</title>
  <meta name="description" content="Live traffic at Woodlands Causeway and Tuas Second Link, both directions.">
  <!-- Link previews (WhatsApp, Telegram, iMessage, X, Facebook…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JamOrNot">
  <meta property="og:title" content="JamOrNot: is the Causeway jammed?">
  <meta property="og:description" content="Live traffic at Woodlands Causeway and Tuas Second Link, to JB and to SG. Estimated waits and live cams.">
  <meta property="og:url" content="https://jamornot.pages.dev/">
  <meta property="og:image" content="https://jamornot.pages.dev/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="JamOrNot: live traffic at Woodlands Causeway and Tuas Second Link">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="top-row">
        <h1>JamOrNot</h1>
        <button id="refresh" class="refresh" type="button" aria-label="Refresh now"><span class="refresh-icon" aria-hidden="true">↻</span> Refresh</button>
      </div>
      <div class="top-sub">
        <time id="now" class="now" title="Singapore time"></time>
        <span id="updated" class="updated" aria-live="polite">Loading…</span>
      </div>
    </header>

    <section id="verdict" class="card verdict" aria-live="polite">
      <p class="verdict-line">Checking the roads…</p>
      <p class="verdict-line">&nbsp;</p>
    </section>

    <div id="crossings"></div>

    <details class="card how">
      <summary>How to read these numbers</summary>
      <div id="how-body"><p>Loading…</p></div>
    </details>

    <footer class="foot">Estimates, not promises. Live cams via LTA. Refresh for fresher regret.<span id="attrib" hidden><br>Drive times © TomTom.</span></footer>
  </main>

  <dialog id="lightbox" class="lightbox">
    <form method="dialog"><button class="close" aria-label="Close">✕</button></form>
    <img id="lightbox-img" alt="">
    <p id="lightbox-cap" class="lightbox-cap"></p>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
